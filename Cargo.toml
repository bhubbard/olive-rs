[package]
name = "olive-rs"
version = "0.0.1"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "Pure Rust node-based video compositing and non-linear editing graph engine inspired by Olive Video Editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bhubbard/olive-rs"
homepage = "http://code.brandonhubbard.com/olive-rs/"
readme = "README.md"
keywords = ["video-editor", "compositing", "node-graph", "olive", "nle"]
categories = ["multimedia::video", "rendering"]

[[bin]]
name = "olive-render"
path = "src/bin/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-rational = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
